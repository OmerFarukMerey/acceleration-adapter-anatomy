[project]
name = "wspd"
version = "0.1.0"
description = "What few-step distillation adapters for diffusion models have in common in weight space"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "torch>=2.6",
  "torchvision>=0.21",
  "diffusers>=0.35",
  "transformers>=4.50",
  "accelerate>=1.0",
  "safetensors>=0.5",
  "lpips>=0.1.4",
  "numpy>=2.0",
  "scipy>=1.14",
  "pillow>=10",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Needed by scripts/study only: adapter downloads, and FID and KID in s7_score.py.
study = ["huggingface_hub", "clean-fid>=0.1.35"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
